<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Brother Moving</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home" data-target="home" data-translate="home">Home</a></li>
                <li><a href="#services" data-target="services" data-translate="services">Services</a></li>
                <li><a href="#contact" data-target="contact" data-translate="contact">Contact</a></li>
            </ul>
            <select id="language-selector">
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="ko">한국어</option>
            </select>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1 data-translate="welcome">Welcome to US Brother Moving</h1>
            <p data-translate="description">We provide the best moving services in the area.</p>
        </section>

        <section id="services">
            <h2 data-translate="services">Services</h2>
            <div class="service-cards">
                <!-- Service cards content -->
            </div>
        </section>

        <section id="contact">
            <h2 data-translate="contact_us">Contact Us</h2>
            <form id="contact-form">
                <input type="text" id="name" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" placeholder="Message" required></textarea>
                <button type="submit" data-translate="send">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p data-translate="footer">© 2023 US Brother Moving. All rights reserved.</p>
    </footer>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
