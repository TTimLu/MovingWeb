<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Brother Moving</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="US Brother Moving Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#" id="home">Home</a></li>
                <li><a href="#" id="services">Services</a></li>
                <li><a href="#" id="contact">Contact</a></li>
                <li><a href="#" id="quote">Get a Free Quote</a></li>
            </ul>
        </nav>
        <div class="language-selector">
            <select id="language-selector">
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="ko">한국어</option>
            </select>
        </div>
    </header>

    <main>
        <section id="intro">
            <h1 id="heading">Moving Made Easy</h1>
            <p id="intro-text">We offer reliable moving services to make your transition smooth and hassle-free.</p>
            <button id="get-quote-button">Get a Free Quote</button>
        </section>
        
        <section id="contact-section">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message" required></textarea>
                <button type="submit" id="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 US Brother Moving. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
